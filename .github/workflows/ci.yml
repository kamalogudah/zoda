name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Verify pinned Zig version
        run: |
          test "$(zig version)" = "${{ env.ZIG_VERSION }}"
      - name: Build
        run: zig build
      - name: Run tests
        run: zig build test
      - name: Smoke-run executable
        run: ./zig-out/bin/zoda