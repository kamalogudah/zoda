name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only checks out and builds, so the token is
# read-only. No workflow uses secrets or needs write access. The pull_request
# trigger (not pull_request_target) keeps fork PRs unprivileged.
permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.1"

jobs:
  check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src examples

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Verify pinned Zig version
        run: |
          test "$(zig version)" = "${{ env.ZIG_VERSION }}"
      - name: Build
        run: zig build
      - name: Run tests
        run: zig build test
      - name: Compile public API example
        run: zig build test-examples
      - name: Adversarial HTTP/1.1 suite (ReleaseSafe)
        run: zig build test-hardening -Doptimize=ReleaseSafe --summary all
      - name: 60-second load and overload measurements (ReleaseSafe)
        run: zig build test-load -Doptimize=ReleaseSafe --summary all
      - name: Development-loop recovery and edit-to-response latency
        run: zig build test-devloop --summary all
      - name: Smoke-run executable
        run: ./zig-out/bin/zoda
